services:
  # ============================================================
  # 1. PostgreSQL 17 Database
  # ============================================================
  postgres:
    image: postgres:17-alpine
    container_name: smartpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${DB_NAME:-smartpos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smartpos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpos-net

  # ============================================================
  # 2. Redis Cache & Job Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: smartpos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartpos-net

  # ============================================================
  # 3. SMARTPOS Express Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpos-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_2026}@postgres:5432/${DB_NAME:-smartpos}}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smartpos}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-${JWT_SECRET:-super_secret_jwt_access_token_key_2026_uz}}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_access_token_key_2026_uz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_token_key_2026_uz}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-click_test_secret}
      PAYME_KEY: ${PAYME_KEY:-payme_test_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - smartpos-net

  # ============================================================
  # 4. SMARTPOS React Frontend (Nginx SPA Host)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartpos-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  smartpos-net:
    driver: bridge
